services:
  postgres:
    image: postgres:16
    container_name: reserved-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - reserved-postgres-data:/var/lib/postgresql/data

volumes:
  reserved-postgres-data:
